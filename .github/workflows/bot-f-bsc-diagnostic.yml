name: Bot F - BSC read-only diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsc-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Run read-only BSC diagnostic
        id: diagnostic
        continue-on-error: true
        env:
          BOT_F_RPC_URL_BSC: ${{ secrets.BOT_F_RPC_URL_BSC }}
        run: |
          python scripts/diagnose_uncx_bsc.py \
            --pool 0x8b8677f508f0758d05b2957e16371be3f231fcd8 \
            --pool 0x7500d19c281066887c1d5bb885997375738bf517 \
            > bsc-diagnostic.json
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-f-bsc-diagnostic
          path: bsc-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
