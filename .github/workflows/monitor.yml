name: Dot Cripto Monitor

on:
  schedule:
    # GitHub Actions pode atrasar execuções; não é monitorização em tempo real.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dot-cripto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore Bot F deduplication state
        uses: actions/cache@v4
        with:
          path: data/bot_f_seen.json
          key: bot-f-seen-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-f-seen-${{ runner.os }}-${{ github.ref_name }}-
      - name: Restore Bot G social history
        uses: actions/cache@v4
        with:
          path: data/bot_g_social_history.json
          key: bot-g-social-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-g-social-${{ runner.os }}-${{ github.ref_name }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run independent monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOPLUS_ENABLED: ${{ secrets.GOPLUS_ENABLED }}
          GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
          GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
        run: python -m app.main
      - name: Upload logs and alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-cripto-logs-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
