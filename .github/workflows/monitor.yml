name: Dot Cripto Monitor

on:
  schedule:
    # GitHub Actions pode atrasar execuções; não é monitorização em tempo real.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dot-cripto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # A manual run on main remains the normal full-system cycle. When a
    # non-main branch is selected, only the isolated Bot G validation job runs.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore alert cooldown state
        uses: actions/cache/restore@v4
        with:
          path: data/alert_cooldown.json
          key: alert-cooldown-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alert-cooldown-${{ runner.os }}-${{ github.ref_name }}-
      - name: Restore Bot G social history
        uses: actions/cache@v4
        with:
          path: data/bot_g_social_history.json
          key: bot-g-social-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-g-social-${{ runner.os }}-${{ github.ref_name }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run independent monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_F_ENABLED: "false"
          GOPLUS_ENABLED: ${{ secrets.GOPLUS_ENABLED }}
          GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
          GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
        run: python -m app.main
      - name: Save alert cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/alert_cooldown.json
          key: alert-cooldown-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload logs and alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-cripto-logs-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14

  bot-g-validation:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected validation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore Bot G social history
        uses: actions/cache@v4
        with:
          path: data/bot_g_social_history.json
          key: bot-g-social-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bot-g-social-${{ runner.os }}-${{ github.ref_name }}-
            bot-g-social-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run isolated Bot G tests without repository secrets
        run: python -m pytest tests/test_bot_g.py tests/test_lunarcrush_social.py -q
      - name: Upload Bot G validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-g-validation-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14
