name: Dot Cripto Historical Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical sample window (60–365 days)"
        required: true
        default: "180"
        type: string
      fee_per_side_pct:
        description: "Estimated fee per side, in percent (assumption)"
        required: true
        default: "0.10"
        type: string
      slippage_per_side_pct:
        description: "Estimated slippage per side, in percent (assumption)"
        required: true
        default: "0.05"
        type: string

permissions:
  contents: read

jobs:
  historical-event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download candles and run point-in-time event study
        run: >-
          python -m app.historical_backtest
          --days "${{ inputs.days }}"
          --fee-per-side-pct "${{ inputs.fee_per_side_pct }}"
          --slippage-per-side-pct "${{ inputs.slippage_per_side_pct }}"
      - name: Run portfolio backtest and enforce positive out-of-sample returns
        run: >-
          python -m app.portfolio_backtest
          --days "${{ inputs.days }}"
          --fee-per-side-pct "${{ inputs.fee_per_side_pct }}"
          --slippage-per-side-pct "${{ inputs.slippage_per_side_pct }}"
      - name: Upload historical sample and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-cripto-historical-backtest-${{ github.run_id }}
          path: |
            data/historical/
            data/backtest/
          if-no-files-found: warn
          retention-days: 30
