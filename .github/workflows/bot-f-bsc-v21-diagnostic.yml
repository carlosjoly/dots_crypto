name: Bot F - BSC UNCX V2.1 lock diagnostic

on:
  workflow_dispatch:
    inputs:
      lookback_blocks:
        description: "Bounded event-history lookback (maximum 500000 blocks)"
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

jobs:
  bsc-v21-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Compile V2.1 diagnostic
        run: python -m py_compile scripts/diagnose_uncx_bsc_v21.py
      - name: Test V2.1 diagnostic decoders
        run: python -m unittest discover -s tests -p 'test_uncx_bsc_v21_diagnostic.py' -v
      - name: Run read-only UNCX V2.1 diagnostic
        id: diagnostic
        continue-on-error: true
        env:
          BOT_F_RPC_URL_BSC: ${{ secrets.BOT_F_RPC_URL_BSC }}
          LOOKBACK_BLOCKS: ${{ inputs.lookback_blocks }}
        run: |
          python scripts/diagnose_uncx_bsc_v21.py \
            --lookback-blocks "$LOOKBACK_BLOCKS" \
            --pool 0x8b8677f508f0758d05b2957e16371be3f231fcd8 \
            --pool 0x7500d19c281066887c1d5bb885997375738bf517 \
            > bsc-v21-diagnostic.json
      - name: Upload V2.1 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-f-bsc-v21-diagnostic
          path: bsc-v21-diagnostic.json
          if-no-files-found: warn
          retention-days: 7
