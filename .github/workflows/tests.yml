name: Dot Cripto Tests

on:
  push:
    branches:
      - "fix/padrao-mensagens-telegram"
      - "feature/bot-f-new-launches-goplus"
      - "feature/bot-g-social-alert-validation"
  # Run the test suite for every PR target branch. Restricting this to
  # main silently skipped validation for stacked PRs based on feature branches.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test all modules
        run: python -m unittest discover -s tests -v
      - name: Print Telegram message preview (no delivery)
        run: python preview_alert.py
