name: Dot Cripto Tests

on:
  push:
    branches:
      - "fix/padrao-mensagens-telegram"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test alert formatting
        run: python -m unittest discover -s tests -v
      - name: Print Telegram message preview (no delivery)
        run: python preview_alert.py
