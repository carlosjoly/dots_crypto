name: Dot Cripto Tests

on:
  push:
    branches:
      - "fix/padrao-mensagens-telegram"
      - "feature/bot-f-new-launches-goplus"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test all modules
        run: python -m unittest discover -s tests -v
      - name: Print Telegram message preview (no delivery)
        run: python preview_alert.py

      - name: Probe LunarCrush free-tier access (PR #8 only; one read-only request)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
        env:
          SOCIAL_API_KEY: ${{ secrets.SOCIAL_API_KEY }}
        run: python scripts/lunarcrush_free_probe.py
