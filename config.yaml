exchange:
  base_url: "https://data-api.binance.vision"
  quote_asset: "USDT"
  symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "LINKUSDT"]
  timeframes: ["15m", "1h", "4h"]
  candle_limit: 120
  min_quote_volume_24h_usdt: 5000000
  max_spread_pct: 0.25

thresholds:
  move_15m_pct: 1.8
  move_1h_pct: 3.5
  move_4h_pct: 6.0
  relative_volume: 1.8
  breakout_lookback: 20
  rsi_oversold: 30
  rsi_overbought: 70
  atr_stop_multiple: 1.5
  min_risk_reward: 1.5

alerts:
  telegram_enabled: true
  cooldown_minutes: 60
  log_file: "data/alerts.jsonl"

launches:
  enabled: true
  provider: "GeckoTerminal"
  networks: ["eth", "base", "bsc", "arbitrum", "polygon_pos", "optimism", "avalanche"]
  min_pool_age_minutes: 5
  max_pool_age_hours: 48
  min_liquidity_usd: 25000
  min_volume_24h_usd: 10000
  min_txns_24h: 50
  max_security_checks_per_cycle: 15
  max_buy_sell_tax: 0.05
  quote_symbols: ["USDC", "USDT", "WETH", "WBNB", "DAI", "USDBC", "USDE"]
  seen_state_file: "data/bot_f_seen.json"

security:
  goplus_enabled: true
  chain_id: "1"
  token_addresses: []
